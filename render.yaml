services:
  - type: web
    name: genetiq-server
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash
      - key: GEMMA_MODEL
        value: models/gemma-4-26b-a4b-it
      - key: HF_TOKEN
        sync: false
