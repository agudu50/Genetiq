# Google Cloud Build configuration for Genetiq (Cloud Run Deployment)
steps:
  # 1. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/genetiq-server:$COMMIT_SHA', './server']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/genetiq-server:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'genetiq-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/genetiq-server:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,GEMINI_MODEL=gemini-3.5-flash'

images:
  - 'gcr.io/$PROJECT_ID/genetiq-server:$COMMIT_SHA'
